# ============================================================
# AgriBridge – H2 In-Memory Database Fallback Profile
# ============================================================
# Use when MySQL is not available.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
#
# H2 Console: http://localhost:8080/h2-console
#   JDBC URL : jdbc:h2:mem:agribridge_db
#   Username : sa
#   Password : (leave blank)
# ============================================================

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:agribridge_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Logging – reduce noise in H2 mode
logging.level.com.agribridge=INFO
logging.level.org.springframework.security=WARN
