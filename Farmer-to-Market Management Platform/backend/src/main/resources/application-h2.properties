# ============================================================
# AgriBridge – H2 In-Memory Database Fallback Profile
# ============================================================
# This profile is used when MySQL is not available.
# To run with H2: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ============================================================

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:agribridge_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
