# ============================================================
# AgriBridge – Application Configuration
# ============================================================

# Server
server.port=8080

# ============================================================
# Database – MySQL (PRIMARY)
# ============================================================
# REQUIREMENTS:
# - MySQL server running on localhost:3306
# - Username: root  |  Password: vyshu092007
# - Database 'agribridge_db' will be created automatically
#
# ⚡ QUICK START WITHOUT MYSQL:
#   Run with H2 in-memory DB (no setup needed):
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
#   H2 console: http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:agribridge_db  |  User: sa  |  Password: (empty)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/agribridge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true
spring.datasource.username=root
spring.datasource.password=vyshu092007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================================
# JWT Configuration
# ============================================================
app.jwt.secret=YWdyaWJyaWRnZS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi0yMDI0
app.jwt.expiration=86400000

# ============================================================
# CORS – allow Vite dev server
# ============================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================================================
# Logging
# ============================================================
logging.level.com.agribridge=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ============================================================
# Jackson Configuration
# ============================================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=NON_NULL
