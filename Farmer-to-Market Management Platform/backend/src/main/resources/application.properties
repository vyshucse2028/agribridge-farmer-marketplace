# ============================================================
# AgriBridge – Application Configuration
# ============================================================

# Server
server.port=8080

# ============================================================
# Database – MySQL (PRIMARY)
# ============================================================
# REQUIREMENTS:
# - MySQL server running on localhost:3306
# - Username: root
# - Password: vyshu092007
# - Database 'agribridge_db' will be created automatically if not exists
#
# FALLBACK OPTION:
# If MySQL is not available or credentials are incorrect, use H2 in-memory database:
# Run with profile h2: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# H2 console will be available at: http://localhost:8080/h2-console
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/agribridge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=vyshu092007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JWT Configuration
# ============================================================
app.jwt.secret=YWdyaWJyaWRnZS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi0yMDI0
app.jwt.expiration=86400000

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=http://localhost:5173

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================================================
# Logging
# ============================================================
logging.level.com.agribridge=DEBUG
logging.level.org.springframework.security=INFO

# ============================================================
# Jackson Configuration
# ============================================================
spring.jackson.serialization.fail-on-empty-beans=false

